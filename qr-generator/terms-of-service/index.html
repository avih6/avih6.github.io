        .theme-fab {
            position: fixed;
            bottom: 30px;
            right: 30px;
            background: var(--fab-bg);
            backdrop-filter: blur(10px); 
            -webkit-backdrop-filter: blur(10px);
            color: var(--text);
            border: 1px solid var(--fab-border);
            width: 50px;
            height: 50px;
            border-radius: 12px; 
            cursor: pointer;
            box-shadow: 0 8px 32px rgba(0,0,0,0.1);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            z-index: 1000;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .theme-fab:hover {
            transform: translateY(-5px);
            box-shadow: 0 12px 40px rgba(0,0,0,0.2);
            background: var(--card-bg);
        }
        .theme-fab span { display: flex; align-items: center; justify-content: center; }

<script>
  const sunIcon = `<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line></svg>`;
  const moonIcon = `<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>`;

  (function() {
    var savedTheme = localStorage.getItem('theme');
    if (savedTheme === 'dark') {
      document.documentElement.classList.add('dark-mode');
      document.documentElement.classList.remove('light-mode');
    } else if (savedTheme === 'light') {
      document.documentElement.classList.add('light-mode');
      document.documentElement.classList.remove('dark-mode');
    }
  })();

  function isCurrentlyDark() {
    if (document.documentElement.classList.contains('dark-mode')) return true;
    if (document.documentElement.classList.contains('light-mode')) return false;
    return window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
  }

  function updateThemeIcon() {
    var container = document.getElementById('theme-icon-container');
    if (container) {
      container.innerHTML = isCurrentlyDark() ? sunIcon : moonIcon;
    }
  }

  function toggleTheme() {
    var willBeDark = !isCurrentlyDark();
    if (willBeDark) {
      document.documentElement.classList.add('dark-mode');
      document.documentElement.classList.remove('light-mode');
      localStorage.setItem('theme', 'dark');
    } else {
      document.documentElement.classList.add('light-mode');
      document.documentElement.classList.remove('dark-mode');
      localStorage.setItem('theme', 'light');
    }
    updateThemeIcon();
  }

  if (window.matchMedia) {
    window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', function(e) {
      if (!localStorage.getItem('theme')) {
        updateThemeIcon();
      }
    });
  }

  window.addEventListener('DOMContentLoaded', updateThemeIcon);
</script>

        <span id="theme-icon-container"></span>
    </button>
