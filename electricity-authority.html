<!DOCTYPE html>
<html>
<head>
    <link rel="preconnect" href="https://www.googletagmanager.com">
    <link rel="preconnect" href="https://www.google-analytics.com">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://www.googletagmanager.com https://www.google-analytics.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self' https://www.google.com https://*.google.com https://www.googletagmanager.com https://www.google-analytics.com https://*.google-analytics.com https://analytics.google.com https://region1.google-analytics.com https://stats.g.doubleclick.net https://api.hebcal.com;">
    <meta name="referrer" content="strict-origin-when-cross-origin">
  <meta charset="UTF-8">
  <meta http-equiv="refresh" content="0; url=https://www.gov.il/he/departments/electricity_authority">
  <script>window.location.replace("https://www.gov.il/he/departments/electricity_authority");</script>
<script>
  if (window.location.pathname.endsWith('/') && window.location.pathname !== '/') {
    window.history.replaceState(null, '', window.location.pathname.slice(0, -1) + window.location.search + window.location.hash);
  }
</script>
</head>
<body><script>
  (function() {
    if (!window.PointerEvent) return;
    var currentHover = null;
    document.addEventListener('pointerover', function(e) {
      if (e.pointerType === 'pen') {
        var el = e.target.closest('.card, .btn, .theme-fab, .back, .back-link, a');
        if (el && el !== currentHover) {
          if (currentHover) currentHover.classList.remove('is-pen-hover');
          currentHover = el;
          currentHover.classList.add('is-pen-hover');
        }
      }
    }, { passive: true });
    document.addEventListener('pointerout', function(e) {
      if (e.pointerType === 'pen' && currentHover) {
        currentHover.classList.remove('is-pen-hover');
        currentHover = null;
      }
    }, { passive: true });
  })();
</script>
</body>
</html>
