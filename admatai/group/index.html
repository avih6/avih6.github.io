<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#172017">
  <meta property="og:title" content="הזמנה לקבוצה | עד מתי!">
  <meta property="og:description" content="הוזמנת להצטרף לקבוצת חברים באפליקציית עד מתי!">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <title>הזמנה לקבוצה | עד מתי!</title>
  <link rel="icon" type="image/svg+xml" href="../app-icon.svg">
  <style>
    :root {
      --bg: #111811;
      --panel: #202b20;
      --line: rgba(231, 185, 75, .28);
      --gold: #e7b94b;
      --cream: #fff8e8;
      --muted: #b8c1af;
    }
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      min-height: 100vh;
      min-height: 100dvh;
      direction: rtl;
    }
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px 16px;
      overflow-x: hidden;
      background:
        radial-gradient(circle at 18% 12%, #465436 0, transparent 34%),
        radial-gradient(circle at 88% 90%, #334127 0, transparent 38%),
        var(--bg);
      color: var(--cream);
      font-family: "Heebo", Arial, sans-serif;
    }
    .grid {
      position: fixed;
      inset: 0;
      pointer-events: none;
      opacity: .11;
      background-image:
        linear-gradient(rgba(231, 185, 75, .22) 1px, transparent 1px),
        linear-gradient(90deg, rgba(231, 185, 75, .22) 1px, transparent 1px);
      background-size: 28px 28px;
      mask-image: linear-gradient(to bottom, black, transparent);
    }
    main {
      width: 100%;
      max-width: 420px;
      margin: 0 auto;
      position: relative;
      z-index: 1;
    }
    .card {
      width: 100%;
      padding: 32px 24px 26px;
      text-align: center;
      direction: rtl;
      border: 1px solid var(--line);
      border-radius: 28px;
      background: linear-gradient(145deg, rgba(40, 54, 39, .96), rgba(20, 29, 20, .96));
      box-shadow: 0 25px 80px rgba(0, 0, 0, .42), inset 0 1px rgba(255, 255, 255, .05);
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .brand {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      margin-bottom: 24px;
      color: var(--gold);
      font-weight: 800;
      letter-spacing: .2px;
    }
    .brand:before,
    .brand:after {
      content: "";
      width: 26px;
      height: 1px;
      background: var(--gold);
      opacity: .65;
    }
    .icon {
      width: 88px;
      height: 88px;
      border-radius: 23px;
      box-shadow: 0 12px 30px rgba(0, 0, 0, .34);
      margin-bottom: 18px;
      display: block;
    }
    .eyebrow {
      margin: 0 0 8px;
      color: var(--gold);
      font-size: 13px;
      font-weight: 700;
      letter-spacing: .5px;
    }
    h1 {
      margin: 0;
      outline: 0;
      font-size: 26px;
      line-height: 1.3;
      text-wrap: balance;
    }
    p {
      text-align: center;
      margin: 12px auto 24px;
      max-width: 310px;
      line-height: 1.65;
      color: var(--muted);
      font-size: 15px;
    }
    .actions {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: stretch;
      gap: 12px;
      width: 100%;
      max-width: 320px;
      margin: 0 auto;
    }
    .actions a {
      width: 100%;
      min-height: 52px;
      padding: 12px 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      border-radius: 14px;
      overflow: hidden;
      position: relative;
      text-decoration: none;
      font-weight: 800;
      font-size: 15px;
      line-height: 1.3;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
      -webkit-tap-highlight-color: transparent;
      transition: transform .15s ease, box-shadow .15s ease, background-color .15s ease, border-color .15s ease;
    }
    .primary {
      background: var(--gold);
      color: #182016;
      box-shadow: 0 8px 20px rgba(231, 185, 75, .2);
    }
    .primary:active {
      transform: scale(.985);
      box-shadow: inset 0 0 0 999px rgba(255, 255, 255, .24), 0 4px 12px rgba(231, 185, 75, .16);
    }
    .secondary {
      border: 1px solid rgba(255, 255, 255, .18);
      color: var(--cream);
      background: rgba(255, 255, 255, .05);
    }
    .secondary:active {
      transform: scale(.985);
      background: rgba(255, 255, 255, .16);
      border-color: rgba(231, 185, 75, .45);
    }
    @media (hover: hover) {
      a:hover {
        transform: translateY(-2px);
        filter: brightness(1.05);
      }
    }
    a:focus-visible {
      outline: 2px solid var(--gold);
      outline-offset: 2px;
    }
    @media (prefers-reduced-motion: reduce) {
      *, *:before, *:after {
        animation-duration: .01ms !important;
        transition-duration: .01ms !important;
        scroll-behavior: auto !important;
      }
    }
    .note {
      font-size: 12px;
      color: #8d9986;
      margin: 20px 0 0;
    }
    .loader {
      width: 22px;
      height: 22px;
      border: 2px solid rgba(231, 185, 75, .28);
      border-top-color: var(--gold);
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin: 0 auto 16px;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    .hidden {
      display: none !important;
    }
    @media (min-width: 720px) {
      main {
        max-width: 580px;
      }
      .card {
        padding: 46px 56px 36px;
        border-radius: 34px;
      }
      .icon {
        width: 108px;
        height: 108px;
        border-radius: 28px;
        margin-bottom: 22px;
      }
      .brand {
        margin-bottom: 28px;
      }
      h1 {
        font-size: 32px;
      }
      p {
        max-width: 390px;
        font-size: 16px;
      }
      .actions {
        flex-direction: row;
        max-width: 460px;
        gap: 14px;
      }
      .actions a {
        flex: 1 1 0;
        min-height: 54px;
      }
      .actions.single-action {
        max-width: 260px;
      }
      .note {
        margin-top: 24px;
      }
    }
  </style>
</head>
<body>
  <div class="grid"></div>
  <main aria-labelledby="title">
    <section class="card">
      <div class="brand">עד מתי!</div>
      <img class="icon" src="../app-icon.svg" alt="אייקון עד מתי!">
      <div id="loader" class="loader" role="status" aria-label="טוען הזמנה"></div>
      <div id="eyebrow" class="eyebrow">הזמנה לקבוצה</div>
      <h1 id="title">הוזמנת להצטרף לקבוצה</h1>
      <p id="message">לחצו על ׳פתיחת עד מתי׳ כדי לצפות בפרטי הקבוצה ולאשר הצטרפות באפליקציה.</p>
      <div class="actions">
        <a id="open" class="primary" href="https://play.google.com/store/apps/details?id=com.avih6.admatai">פתיחת עד מתי</a>
        <a class="secondary" href="https://play.google.com/store/apps/details?id=com.avih6.admatai">אין לך את האפליקציה? להתקנה</a>
      </div>
      <p id="note" class="note">ההצטרפות לקבוצה מתבצעת רק לאחר אישורך באפליקציה.</p>
    </section>
  </main>
  <script>
    (function () {
      const params = new URLSearchParams(location.search);
      if (params.has("type")) {
        params.delete("type");
        const cleanQs = params.toString();
        history.replaceState(null, "", "/admatai/group" + (cleanQs ? "?" + cleanQs : ""));
      }
      const code = (params.get("code") || "").trim().toUpperCase();
      const inviter = params.get("preview") === "1" ? (params.get("from") || "").trim().slice(0, 40) : "";
      const title = document.getElementById("title");
      const message = document.getElementById("message");
      const open = document.getElementById("open");
      const loader = document.getElementById("loader");
      const actions = document.querySelector(".actions");
      const validCode = /^[A-Z0-9]{12}$/.test(code);

      if (params.get("preview") === "1") {
        title.textContent = inviter ? "הזמנה לקבוצה מאת " + inviter : "הזמנה לקבוצה";
        message.textContent = "הצטרפות לקבוצת חברים באפליקציית עד מתי.";
        open.classList.add("hidden");
        loader.classList.add("hidden");
        actions.classList.add("single-action");
        return;
      }

      if (!validCode) {
        title.textContent = "הקישור אינו תקין";
        message.textContent = "אפשר לבקש מחבר לשלוח קישור הזמנה חדש.";
        open.classList.add("hidden");
        loader.classList.add("hidden");
        actions.classList.add("single-action");
        return;
      }

      const encodedCode = encodeURIComponent(code);
      const appUrl = "admatai://join?type=group&code=" + encodedCode;
      const playStoreFallback = encodeURIComponent("https://play.google.com/store/apps/details?id=com.avih6.admatai");
      const intentUrl = "intent://join?type=group&code=" + encodedCode + "#Intent;scheme=admatai;package=com.avih6.admatai;S.browser_fallback_url=" + playStoreFallback + ";end";
      const isAndroid = /Android/i.test(navigator.userAgent);
      const isMobile = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);

      open.href = isAndroid ? intentUrl : appUrl;
      loader.classList.add("hidden");

      if (isMobile) {
        setTimeout(function () {
          window.location.href = isAndroid ? intentUrl : appUrl;
        }, 450);
      }
    })();
  </script>
</body>
</html>
