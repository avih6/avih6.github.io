<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>הצטרפות לרשימת קניות - My List</title>
    <link rel="icon" type="image/png" href="/icon-my-list.png">
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #f8f9fa;
            color: #202124;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
            text-align: center;
        }
        .card {
            background: white;
            border-radius: 24px;
            padding: 36px 24px;
            max-width: 420px;
            width: 100%;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
        }
        .icon {
            font-size: 64px;
            margin-bottom: 16px;
        }
        h1 {
            font-size: 24px;
            margin: 0 0 8px;
        }
        p {
            color: #5f6368;
            font-size: 16px;
            margin: 0 0 24px;
            line-height: 1.5;
        }
        .code-box {
            background: #e8f0fe;
            color: #1a73e8;
            font-weight: bold;
            font-size: 22px;
            letter-spacing: 2px;
            padding: 12px;
            border-radius: 12px;
            margin-bottom: 24px;
            font-family: monospace;
        }
        .btn {
            display: block;
            background: #1a73e8;
            color: white;
            text-decoration: none;
            font-weight: 600;
            font-size: 16px;
            padding: 14px;
            border-radius: 14px;
            margin-bottom: 12px;
            transition: background 0.2s;
        }
        .btn:hover {
            background: #1557b0;
        }
        .btn-outline {
            background: transparent;
            color: #1a73e8;
            border: 2px solid #1a73e8;
        }
        .btn-outline:hover {
            background: #f1f3f4;
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="icon">🛒</div>
        <h1>הוזמנת לרשימת קניות!</h1>
        <p>מישהו שיתף איתך רשימת קניות משותפת באפליקציית My List.</p>
        
        <div id="codeDisplay" class="code-box">...</div>

        <a id="openAppBtn" href="#" class="btn">פתח ישירות באפליקציה</a>
        <a id="downloadAppBtn" href="https://play.google.com/store/apps/details?id=com.avih6.mylist" class="btn btn-outline">הורד מ-Google Play</a>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const code = (urlParams.get('code') || '').trim().toUpperCase();
        
        if (code) {
            document.getElementById('codeDisplay').innerText = code;
            const appDeepLink = `mylist://join?code=${code}`;
            document.getElementById('openAppBtn').href = appDeepLink;
            
            // Try to open app automatically
            setTimeout(() => {
                window.location.href = appDeepLink;
            }, 300);
        } else {
            document.getElementById('codeDisplay').style.display = 'none';
            document.getElementById('openAppBtn').style.display = 'none';
        }
    </script>
</body>
</html>
